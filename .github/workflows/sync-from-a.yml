name: Sync from lp-proteina-do-trigo-A

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-from-a.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target (lp-proteina-do-trigo-D)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout source (lp-proteina-do-trigo-A)
        uses: actions/checkout@v4
        with:
          repository: DellsantosXD/lp-proteina-do-trigo-A
          path: source
          fetch-depth: 1

      - name: Mirror source into target and push
        run: |
          rsync -a --delete source/ ./ --exclude .git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Cópia de lp-proteina-do-trigo-A"
          git push origin HEAD:main

