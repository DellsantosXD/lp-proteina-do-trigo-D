name: Sync from lp-proteina-do-trigo-A

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-from-a.yml'

permissions:
  contents: write

concurrency:
  group: sync-from-a
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout target (lp-proteina-do-trigo-D)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout source (lp-proteina-do-trigo-A)
        uses: actions/checkout@v4
        with:
          repository: DellsantosXD/lp-proteina-do-trigo-A
          path: source
          fetch-depth: 1

      - name: Copy files one-by-one and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000

          mapfile -t files < <(cd source && find . -type f ! -path './.git/*' | sed 's|^\./||' | sort)
          echo "Found ${#files[@]} files to sync"

          for rel in "${files[@]}"; do
            mkdir -p "$(dirname "$rel")"
            cp -a "source/$rel" "$rel"
            git add "$rel"
            if git diff --staged --quiet; then
              continue
            fi
            git commit -m "Cópia de lp-proteina-do-trigo-A"
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                break
              fi
              sleep "$attempt"
            done
          done

# run-id: 5
