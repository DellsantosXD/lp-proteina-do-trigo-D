name: Sync from lp-proteina-do-trigo-A

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-from-a.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (lp-proteina-do-trigo-A)
        uses: actions/checkout@v4
        with:
          repository: DellsantosXD/lp-proteina-do-trigo-A
          path: source
          fetch-depth: 1

      - name: Force-push source to lp-proteina-do-trigo-D
        working-directory: source
        run: |
          git remote remove origin || true
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/DellsantosXD/lp-proteina-do-trigo-D.git"
          git push origin HEAD:main --force

